# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the code (MUST be the branch that triggered the action)
    - name: Checkout code
      uses: actions/checkout@v4

    - name: DEBUG 
      run: |
        echo "Current working directory is:"
        pwd
        echo "Contents of current dir:"
        ls -a
        
    # 2. Setup Python environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x' 
        
    # 3. Install dependencies from requirements.txt
    - name: Install dependencies
      working-directory: /home/runner/work/MLOPS_Assignment_1/MLOPS_Assignment_1
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    # 4. Run the training script (train2.py for kernelr branch)
    - name: Run Model Training and Evaluation
      working-directory: /home/runner/work/MLOPS_Assignment_1/MLOPS_Assignment_1
      run: |
        python train2.py 
