name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the code (MUST be the branch that triggered the action)
    - name: Checkout code
      uses: actions/checkout@v3

       
    # 2. Setup Python environment
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8' 
        
    # 3. Install dependencies from requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: List files for dependencies
      run: ls -al
        
    # 4. Run the training script (train2.py for kernelr branch)
    - name: Run Model Training and Evaluation
      run: |
        python3 train2.py 
